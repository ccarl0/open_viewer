<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STEP viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #121417; color: #e8eaed;
               font-family: sans-serif; overflow: hidden; touch-action: none; }
  #c { width: 100%; height: 100%; display: block; }
  #bar { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px;
         background: rgba(18,20,23,.85); font-size: 15px; display: flex; gap: 8px; align-items: center; }
  #name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #1c1f24; color: #4fc3f7; border: 1px solid #2c3036; border-radius: 6px;
           padding: 6px 10px; font-size: 13px; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 24px; color: #9aa0a6; pointer-events: none; }
</style>
<script type="importmap">
  { "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }
</script>
<script src="./occt-import-js.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"><span id="name"></span><button id="edges">Edges</button><button id="fit">Fit</button></div>
<div id="msg">Loading model…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const msg = document.getElementById('msg');
const name = window.OpenViewer ? OpenViewer.fileName() : 'model.step';
document.getElementById('name').textContent = name;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121417);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1e7);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
camera.add(sun); sun.position.set(1, 1, 2);
scene.add(camera);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

const model = new THREE.Group();
const edges = new THREE.Group();
scene.add(model, edges);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function fit() {
  const box = new THREE.Box3().setFromObject(model);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  camera.near = size / 1000; camera.far = size * 100; camera.updateProjectionMatrix();
  camera.position.copy(center).add(new THREE.Vector3(1, 0.8, 1).normalize().multiplyScalar(size * 0.9 / Math.min(1, camera.aspect)));
  controls.update();
}
document.getElementById('fit').onclick = fit;
document.getElementById('edges').onclick = () => { edges.visible = !edges.visible; };

(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

try {
  const [occt, buf] = await Promise.all([
    occtimportjs({ locateFile: (f) => './' + f }),
    fetch('/model/current').then((r) => {
      if (!r.ok) throw new Error('Cannot read the file (it may have been moved or access was revoked).');
      return r.arrayBuffer();
    }),
  ]);
  msg.textContent = 'Parsing STEP…';
  await new Promise((r) => setTimeout(r, 30));
  const res = occt.ReadStepFile(new Uint8Array(buf), null);
  if (!res.success || !res.meshes.length) throw new Error('Could not parse this STEP file.');

  for (const m of res.meshes) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if (m.attributes.normal) g.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    if (m.index) g.setIndex(m.index.array);
    if (!m.attributes.normal) g.computeVertexNormals();
    const color = m.color ? new THREE.Color(m.color[0], m.color[1], m.color[2]) : new THREE.Color(0xb0bec5);
    const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.1, roughness: 0.6,
      side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    model.add(new THREE.Mesh(g, mat));
    edges.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 30),
      new THREE.LineBasicMaterial({ color: 0x0b0c0e })));
  }
  fit();
  msg.textContent = '';
} catch (e) {
  msg.textContent = 'Error: ' + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
